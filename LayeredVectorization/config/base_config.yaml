simp_img_seq_indexs: [80, 60, 40, 20, 0]
# simp_img_seq_indexs: [0]
is_save_all_simp_img_seq: True
is_save_masks: True
multiple: 1
approxpolydp_epsilon: 5
color_fitting_type: "dominan" # "dominan" or "mse"
add_visual_path_num_iters: 5
max_path_num_limit: 256

paths_merge_color_threshold: 0.1
paths_merge_distance_threshold: 3
paths_remove_visual_threshold: 7.0

# Depth-ordered overlapping structural phase (disabled by default; use original per-layer optimization)
is_depth_ordered_struct: False
is_split_connected_components: True
is_use_convex_hull_init: False
depth_model_id: "depth-anything/Depth-Anything-V2-Small-hf"

# Coarse-to-fine structural control point scheduling ("squinting")
is_coarse_to_fine: True
coarse_init_max_segments: 4
coarse_max_split_rounds: 8
coarse_initial_iters: 25
coarse_refine_iters: 12
# Mean segment error above which a segment is split. A mismatched pixel costs ~0.4 and a perfect
# boundary reads ~0.01-0.02, so ~0.06 is roughly a 1.5px misalignment. Lower = more segments.
coarse_split_error_threshold: 0.06
coarse_max_segments: 24
coarse_max_splits_per_round: 2
# New anchors are snapped onto the mask contour if it is within this many pixels
coarse_snap_radius: 30

# Scale-proportional geometric regularization (short segments, asymmetric handles, elastica)
is_geom_loss: True
geom_min_seg_ratio: 0.25
geom_short_seg_weight: 0.005
geom_handle_asym_weight: 0.002
geom_elastica_weight: 0.0005
geom_elastica_length_weight: 0.2
geom_elastica_curv_weight: 1.0

# Perform kmeans clustering on target images to reduce color categories
is_cluster_target_img: True
kmeas_k: 80

sam:
  sam_checkpoint: "sam_vit_h_4b8939.pth"
  model_type: "vit_h"
  points_per_side: 32
  pred_iou_thresh: 0.86
  stability_score_thresh: 0.85
  crop_n_layers: 1
  crop_n_points_downscale_factor: 2
  min_mask_region_area: 100
  box_nms_thresh: 0.7

train:
  is_train_stroke: False
  is_train_visual_color: True
  is_train_struct_color: True
  struct_opt_num_iters: 50
  visual_opt_num_iters: 100


base_lr:
  point: 1
  color: 0.01
  stroke_width: 0.1
  stroke_color: 0.01
